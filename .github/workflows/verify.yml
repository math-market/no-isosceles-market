name: Verify submissions

# CI-as-verifier: run the canonical checker on submitted point sets.
# Object tier only (JSON is verified as DATA — safe on untrusted PRs from forks;
# pull_request runs with a read-only token and no secrets). Do NOT switch to
# pull_request_target or run submitted *code* here — generators run in the
# platform sandbox, not in this workflow.

on:
  pull_request:
    paths:
      - 'submissions/**'
  workflow_dispatch:
    inputs:
      file:
        description: 'Path to a submission JSON to verify'
        required: false
        default: 'examples/example_valid.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # A submission may not edit the machinery that judges it. This runs FIRST,
      # before `docker build` — which executes arbitrary commands as root at build
      # time — and before run-checker.sh, which configures the very isolation it is
      # supposed to provide.
      #
      # Caveat, stated because it matters: on `pull_request` the workflow itself
      # comes from the pull request, so a PR that edits `.github/` can disable this
      # step. The enforcement for that is requiring approval before fork workflows
      # run at all; this guard raises the bar for everything else.
      - name: A submission must not touch the judging machinery
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "changed files:"; echo "$changed"
          if echo "$changed" | grep -Eq "^(\.github/|Dockerfile$|run-checker\.sh$|task\.json$|preflight\.sh$)"; then
            echo "::error::this pull request modifies the build or the checker harness"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run the checker
        run: |
          set +e
          RECORD_N64=110   # PatternBoost 2024 (arXiv:2411.00566); 112 speculated but never constructed
          echo "## No-Isosceles — verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files="${{ inputs.file }}"
          else
            files=$(ls submissions/*.json 2>/dev/null)
          fi

          if [ -z "$files" ]; then
            echo "No submission JSON found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          fail=0
          for f in $files; do
            [ -f "$f" ] || continue
            out=$(python3 check.py "$f"); code=$?
            echo "- \`$f\` → $out" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" -ne 0 ]; then
              fail=1
            else
              # extract score and flag record-beaters for n=64
              n=$(python3 -c "import json,sys;print(json.load(open('$f'))['n'])")
              s=$(echo "$out" | sed -n 's/.*score=\([0-9]*\).*/\1/p')
              if [ "$n" = "64" ] && [ -n "$s" ] && [ "$s" -gt "$RECORD_N64" ]; then
                echo "  - 🏆 **beats the n=64 record ($RECORD_N64)** — $s" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done
          exit $fail
